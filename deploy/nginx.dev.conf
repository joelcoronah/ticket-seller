# Local stand-in for Dokploy's Traefik: round-robin over every `api` replica.
worker_processes auto;
worker_rlimit_nofile 65535;
events { worker_connections 16384; }

http {
    access_log off;

    upstream api_pool {
        # Docker DNS returns one A record per replica; resolved at nginx start.
        server api:3000;
        keepalive 512;
    }

    server {
        listen 80 backlog=8192;

        location / {
            proxy_pass http://api_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # SSE: never buffer, keep long-lived streams open.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }
    }
}
